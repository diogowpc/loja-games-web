<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Compra</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2>Exclusão de Compra</h2>
        <form th:action="@{/compras/excluir}" th:object="${compra}" method="post">
            <input type="hidden" th:field="*{idCompra}" />

            <div class="form-group">
                <label>Compra nº:</label>
                <span th:text="*{idCompra}"></span>
            </div>

            <div class="form-group">
                <label>Data:</label>
                <span th:text="*{dataVenda}"></span>
            </div>

            <div class="form-group">
                <label>Valor total (R$):</label>
                <span th:text="*{valorTotal}"></span>
            </div>

            <div class="form-group">
                <label>Status:</label>
                <span th:text="*{status}"></span>
            </div>

            <div class="form-group">
                <input type="submit" value="Excluir">
                <a href="/compras">
                    <input type="button" value="Cancelar">
                </a>
            </div>
        </form>
    </div>
</body>
</html>
