<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Clientes</title>
    <link th:href="@{/css/estiloPaginaListagem.css}" rel="stylesheet" />
</head>
<body>
    <a href="/" class="estiloBotaoLink">Voltar para Página Inicial</a>
    &nbsp;
    <a href="/clientes/novo" class="estiloBotaoLink">Novo Cliente</a>

    <br /><br />

    <div class="divMensagemSucesso" th:unless="${#strings.isEmpty(mensagemSucesso)}">
        <span th:text="${mensagemSucesso}" />
    </div>

    <div class="divMensagemErro" th:unless="${#strings.isEmpty(mensagemErro)}">
        <span th:text="${mensagemErro}" />
    </div>

    <h2>Listagem de Clientes</h2>

    <table class="tabela-listagem">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.idCliente}"></td>
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.cpf}"></td>
                <td th:text="${cliente.telefone}"></td>
                <td>
                    <a th:href="@{'/clientes/editar/' + ${cliente.idCliente}}" class="linkEditar">Editar</a>
                    &nbsp;
                    <a th:href="@{'/clientes/excluir/' + ${cliente.idCliente}}" class="linkExcluir">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
