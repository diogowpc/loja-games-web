<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Cliente</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2>Exclusão de Cliente</h2>
        <form th:action="@{/clientes/excluir}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{idCliente}" />

            <div class="form-group">
                <label>Nome:</label>
                <span th:text="*{nome}"></span>
            </div>

            <div class="form-group">
                <label>CPF:</label>
                <span th:text="*{cpf}"></span>
            </div>

            <div class="form-group">
                <input type="submit" value="Excluir">
                <a href="/clientes">
                    <input type="button" value="Cancelar">
                </a>
            </div>
        </form>
    </div>
</body>
</html>
