<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente</title>
    <link th:href="@{/css/estiloPaginaForm.css}" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h2>Cadastro de Cliente</h2>
        <form th:action="@{/clientes}" th:object="${cliente}" method="post">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" th:field="*{nome}" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF (somente números):</label>
                <input type="text" th:field="*{cpf}" maxlength="11" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" th:field="*{telefone}">
            </div>

            <div class="form-group">
                <input type="submit" value="Enviar">
                <a href="/clientes">
                    <input type="button" value="Cancelar">
                </a>
            </div>
        </form>
    </div>
</body>
</html>
